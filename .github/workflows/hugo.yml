name: Build and deploy Hugo

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source and pinned theme
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install pinned Hugo Extended
        run: |
          HUGO_VERSION="$(cat .hugo-version)"
          HUGO_ARCHIVE="hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          HUGO_RELEASE="https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}"
          mkdir -p "$RUNNER_TEMP/hugo"
          cd "$RUNNER_TEMP/hugo"
          curl --fail --location --retry 3 --remote-name "$HUGO_RELEASE/$HUGO_ARCHIVE"
          curl --fail --location --retry 3 --remote-name "$HUGO_RELEASE/hugo_${HUGO_VERSION}_checksums.txt"
          grep " $HUGO_ARCHIVE\$" "hugo_${HUGO_VERSION}_checksums.txt" | sha256sum --check --strict
          tar -xzf "$HUGO_ARCHIVE" hugo
          echo "$RUNNER_TEMP/hugo" >> "$GITHUB_PATH"

      - name: Build production site
        env:
          TZ: UTC
          HUGO_ENVIRONMENT: production
        run: hugo --gc --minify --panicOnWarning

      - name: Verify generated site and preserved URLs
        run: python3 scripts/check_site.py

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
